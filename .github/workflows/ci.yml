name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, "Phase*"]
  pull_request:
    branches: [main, "Phase*"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,test]"
      - name: Run pre-commit
        run: pre-commit run --all-files
      - name: Run tests
        run: pytest
